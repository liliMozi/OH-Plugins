readmeUrl: https://raw.githubusercontent.com/moononnn/zaiganma/main/README.md
compatibility:
  minAppVersion: 0.1.0
trust: full-access
permissions:
  - 定时截图并分析屏幕内容（需要 Python 3.8+ 运行浮层）
  - 发起本地请求（仅 127.0.0.1）
  - 写入插件自身数据
  - 提供页面、工具与后端路由
contributions:
  - tools
  - page
  - routes
distribution:
  kind: release
  packageUrl: https://github.com/moononnn/zaiganma/releases/download/v0.2.3/zaiganma-v0.2.3.zip
